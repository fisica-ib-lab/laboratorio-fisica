    <line x1="221" y1="181" x2="221" y2="184"/><line x1="252" y1="181" x2="252" y2="187"/><line x1="283" y1="181" x2="283" y2="184"/>
  </g>
  <line x1="66" y1="181" x2="66" y2="190" stroke="#1F4D78" stroke-width="2"/>
