  <line x1="66" y1="104" x2="112" y2="104" stroke="#5A6B7D" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M96,104 A30,30 0 0 0 89,84.7" fill="none" stroke="#2E74B5" stroke-width="1.6"/>
  <text x="102" y="92" font-size="13" font-style="italic" font-weight="700" fill="#1F4D78">θ</text>
