  <path d="M66,104 Q150,-30 262,163.5" fill="none" stroke="#2E74B5" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#EEF1F5" stroke="#1F2A36" stroke-width="1.2" opacity="0.7">
    <circle cx="103" cy="62" r="6.5"/><circle cx="212" cy="88" r="6.5"/><circle cx="240" cy="128" r="6.5"/>
  </g>
  <!-- bola con componentes -->
  <line x1="160" y1="42" x2="204" y2="42" stroke="#C25E0C" stroke-width="3.5"/><polygon points="214,42 203,36 203,48" fill="#C25E0C"/>
  <line x1="160" y1="42" x2="160" y2="66" stroke="#5B4B8A" stroke-width="3.5"/><polygon points="160,76 154,65 166,65" fill="#5B4B8A"/>
