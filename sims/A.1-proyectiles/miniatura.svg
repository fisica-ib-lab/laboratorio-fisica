  <text x="143" y="74" font-size="13" font-style="italic" font-weight="700" fill="#5B4B8A">v<tspan font-size="9" dy="3">y</tspan></text>
  <text x="218" y="82" font-size="13" font-style="italic" font-weight="700" fill="#1E7B4F">v</text>
