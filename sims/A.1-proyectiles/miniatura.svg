  <line x1="26" y1="120" x2="46" y2="120" stroke="#1F2A36" stroke-width="5" stroke-linecap="round"/>
  <line x1="26" y1="120" x2="46" y2="120" stroke="#8A97A6" stroke-width="3" stroke-linecap="round"/>
  <rect x="19" y="113" width="14" height="14" rx="3" fill="#2F3E4E" stroke="#1F2A36" stroke-width="1.2"/>
  <g transform="translate(66,104) rotate(-40)">
    <rect x="-52" y="-8.5" width="46" height="17" rx="4" fill="#B5CFEC"/>
    <path d="M-52,-4.5 a4,4 0 0 1 4,-4 h3 v17 h-3 a4,4 0 0 1 -4,-4 Z" fill="#2E74B5"/>
    <rect x="-52" y="-8.5" width="46" height="17" rx="4" fill="none" stroke="#1F2A36" stroke-width="1.5"/>
    <rect x="-10" y="-10" width="4" height="20" fill="#2F3E4E" stroke="#1F2A36" stroke-width="1.2"/>
  </g>
  <circle cx="46" cy="120" r="3.2" fill="#E2B045" stroke="#1F2A36" stroke-width="1"/>
