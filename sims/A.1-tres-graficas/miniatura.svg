<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="Calibri, Carlito, Arial, sans-serif">
  <rect width="320" height="200" fill="#FFFFFF"/>
  <!-- pista -->
  <line x1="18" y1="66" x2="302" y2="66" stroke="#1F2A36" stroke-width="2"/>
