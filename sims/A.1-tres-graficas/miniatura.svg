  </g>
  <g transform="translate(114,104)">
    <rect width="92" height="80" fill="#FFF" stroke="#C9D3DF"/>
    <line x1="8" y1="72" x2="88" y2="72" stroke="#1F2A36" stroke-width="1.2"/><line x1="8" y1="72" x2="8" y2="6" stroke="#1F2A36" stroke-width="1.2"/>
