<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="Calibri, Carlito, Arial, sans-serif">
  <rect width="320" height="200" fill="#FFFFFF"/>
  <!-- mesa -->
  <rect x="0" y="184" width="320" height="3" fill="#EFE8DC"/>
  <rect x="0" y="187" width="320" height="5" fill="#D3AC84"/>
  <!-- plano inclinado de aluminio (30°) -->
  <polygon points="14,184 214,184 214,68.5" fill="#E4E9EF" stroke="#1F2A36" stroke-width="1.3"/>
  <line x1="14" y1="183" x2="214" y2="67.5" stroke="#5A6B7D" stroke-width="3"/>
  <rect x="208" y="54" width="6" height="14" fill="#8A97A6" stroke="#1F2A36" stroke-width="1.2" transform="rotate(-30 214 68)"/>
  <path d="M48,184 A34,34 0 0 0 43.4,167" fill="none" stroke="#1F4D78" stroke-width="1.5"/>
  <text x="54" y="177" font-size="12" font-weight="700" fill="#1F4D78"><tspan font-style="italic">θ</tspan></text>
  <!-- bloque -->
  <g transform="translate(118,124) rotate(-30)">
    <rect x="-27" y="-34" width="54" height="34" rx="4" fill="#B5CFEC" stroke="#1F2A36" stroke-width="1.5"/>
    <rect x="-27" y="-7" width="54" height="7" fill="#2E74B5"/>
    <rect x="-27" y="-34" width="54" height="34" rx="4" fill="none" stroke="#1F2A36" stroke-width="1.5"/>
  </g>
  <!-- fuerzas: peso, normal y rozamiento -->
  <line x1="126.5" y1="109" x2="126.5" y2="160" stroke="#5B4B8A" stroke-width="3.5"/><polygon points="126.5,171 120.5,159 132.5,159" fill="#5B4B8A"/>
  <text x="134" y="168" font-size="14" font-weight="700" fill="#5B4B8A"><tspan font-style="italic">F</tspan><tspan font-size="10" dy="3">g</tspan></text>
  <line x1="105" y1="131" x2="85" y2="96" stroke="#2E74B5" stroke-width="3.5"/><polygon points="80,87.5 80.5,101 90.8,95" fill="#2E74B5"/>
  <text x="62" y="88" font-size="14" font-weight="700" fill="#2E74B5"><tspan font-style="italic">F</tspan><tspan font-size="10" dy="3">N</tspan></text>
  <line x1="122" y1="122" x2="148" y2="107" stroke="#C25E0C" stroke-width="3.5"/><polygon points="157,102 143,102.5 149,112.8" fill="#C25E0C"/>
  <text x="158" y="100" font-size="14" font-weight="700" fill="#C25E0C"><tspan font-style="italic">F</tspan><tspan font-size="10" dy="3">f</tspan></text>
  <!-- diagrama de cuerpo libre -->
  <rect x="234" y="12" width="78" height="118" rx="8" fill="#FFFFFF" stroke="#C9D3DF" stroke-width="1.5"/>
  <rect x="266" y="64" width="14" height="14" fill="#B5CFEC" stroke="#1F2A36" stroke-width="1.2" transform="rotate(-30 273 71)"/>
  <line x1="273" y1="71" x2="273" y2="108" stroke="#5B4B8A" stroke-width="3"/><polygon points="273,117 268,107 278,107" fill="#5B4B8A"/>
  <line x1="273" y1="71" x2="259" y2="47" stroke="#2E74B5" stroke-width="3"/><polygon points="255,40 255.5,51 263.8,46.2" fill="#2E74B5"/>
  <line x1="273" y1="71" x2="292" y2="60" stroke="#C25E0C" stroke-width="3"/><polygon points="300,55.5 288.5,55.6 293.4,64.4" fill="#C25E0C"/>
  <text x="273" y="28" font-size="11" text-anchor="middle" font-weight="700" fill="#1F4D78">cuerpo libre</text>
  <!-- fuerza neta aparte -->
  <rect x="234" y="138" width="78" height="24" rx="6" fill="#FBEDED"/>
  <text x="242" y="155" font-size="12" font-weight="700" fill="#C00000"><tspan font-style="italic">F</tspan><tspan font-size="9" dy="2">neta</tspan><tspan dy="-2"> = </tspan><tspan font-style="italic">ma</tspan></text>
</svg>
