<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="Calibri, Carlito, Arial, sans-serif">
  <rect width="320" height="200" fill="#FFFFFF"/>
  <!-- mesa -->
  <rect x="0" y="184" width="320" height="3" fill="#EFE8DC"/>
  <rect x="0" y="187" width="320" height="5" fill="#D3AC84"/>
  <!-- soporte con escala -->
  <polygon points="24,184 32,177 60,177 68,184" fill="#5A6B7D" stroke="#1F2A36" stroke-width="1.2"/>
  <rect x="42" y="8" width="8" height="169" fill="#E4E9EF" stroke="#1F2A36" stroke-width="1.2"/>
  <g stroke="#5A6B7D" stroke-width="1">
    <line x1="42" y1="160" x2="46" y2="160"/><line x1="42" y1="143" x2="46" y2="143"/><line x1="42" y1="126" x2="50" y2="126"/><line x1="42" y1="109" x2="46" y2="109"/>
    <line x1="42" y1="92" x2="46" y2="92"/><line x1="42" y1="75" x2="50" y2="75"/><line x1="42" y1="58" x2="46" y2="58"/><line x1="42" y1="41" x2="46" y2="41"/><line x1="42" y1="24" x2="50" y2="24"/>
  </g>
  <!-- electroimán -->
  <line x1="46" y1="22" x2="100" y2="22" stroke="#1F2A36" stroke-width="5" stroke-linecap="round"/><line x1="46" y1="22" x2="100" y2="22" stroke="#8A97A6" stroke-width="3" stroke-linecap="round"/>
  <rect x="39" y="15" width="14" height="14" rx="3" fill="#2F3E4E" stroke="#1F2A36" stroke-width="1.2"/>
  <rect x="90" y="14" width="20" height="15" rx="3" fill="#2F3E4E" stroke="#1F2A36" stroke-width="1.2"/><rect x="91" y="23" width="18" height="3" fill="#E2B045"/>
  <!-- huellas: distancias 1 : 3 : 5 : 7 -->
  <g fill="#EEF1F5" stroke="#1F2A36" stroke-width="1.2" opacity="0.7">
    <circle cx="100" cy="35.5" r="6.5"/><circle cx="100" cy="43.5" r="6.5"/><circle cx="100" cy="67.5" r="6.5"/><circle cx="100" cy="107.5" r="6.5"/>
  </g>
  <circle cx="100" cy="163.5" r="6.5" fill="#C9D3DF" stroke="#1F2A36" stroke-width="1.4"/>
  <line x1="84" y1="150" x2="84" y2="170" stroke="#1E7B4F" stroke-width="3.5"/><polygon points="84,181 78,169 90,169" fill="#1E7B4F"/>
  <text x="70" y="168" font-size="14" font-style="italic" font-weight="700" fill="#1E7B4F">v</text>
  <line x1="116" y1="150" x2="116" y2="166" stroke="#C00000" stroke-width="3.5"/><polygon points="116,177 110,165 122,165" fill="#C00000"/>
  <text x="125" y="166" font-size="14" font-style="italic" font-weight="700" fill="#C00000">a</text>
  <!-- puerta fotoeléctrica y cable -->
  <line x1="46" y1="134" x2="126" y2="134" stroke="#1F2A36" stroke-width="3"/>
  <rect x="39" y="127" width="14" height="14" rx="3" fill="#2F3E4E" stroke="#1F2A36" stroke-width="1.2"/>
  <rect x="74" y="114" width="8" height="21" rx="2" fill="#2F3E4E" stroke="#1F2A36" stroke-width="1.2"/><rect x="118" y="114" width="8" height="21" rx="2" fill="#2F3E4E" stroke="#1F2A36" stroke-width="1.2"/>
  <line x1="82" y1="121" x2="118" y2="121" stroke="#C00000" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M126,125 Q150,190 172,160" fill="none" stroke="#1F2A36" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="168" y="140" width="62" height="44" rx="4" fill="#2F3E4E" stroke="#1F2A36" stroke-width="1.2"/><rect x="173" y="145" width="52" height="28" fill="#E8F1F8"/>
  <text x="178" y="163" font-size="11" font-weight="700" fill="#1F4D78"><tspan font-style="italic">t</tspan> = 0,391 s</text>
  <!-- ecuaciones -->
  <g font-size="15" font-weight="700" font-style="italic" fill="#1F4D78">
    <text x="176" y="34">v = u + at</text>
    <text x="176" y="60">s = ut + ½at²</text>
    <text x="176" y="86">v² = u² + 2as</text>
    <text x="176" y="112">s = ½(u + v)t</text>
  </g>
</svg>
